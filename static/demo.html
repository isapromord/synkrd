<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofía AI — SynkDR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Top Bar ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid #1e1e1e;
      background: #0a0a0a;
      flex-shrink: 0;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #e0e0e0;
    }

    .topbar-logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #7C3AED, #A78BFA);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
    }

    .topbar-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #888;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      text-decoration: none;
    }

    .topbar-btn:hover {
      border-color: #444;
      color: #ccc;
    }

    .topbar-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #34D399;
    }

    .topbar-status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34D399;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ─── Chat Container ─── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ─── Welcome Screen ─── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 24px;
      text-align: center;
    }

    .welcome.hidden { display: none; }

    .welcome-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C3AED, #A78BFA);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #f0f0f0;
      letter-spacing: -0.02em;
    }

    .welcome p {
      font-size: 0.95rem;
      color: #666;
      max-width: 480px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      max-width: 560px;
    }

    .suggestion {
      padding: 10px 18px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .suggestion:hover {
      border-color: #7C3AED;
      color: #d4c4f7;
      background: rgba(124, 58, 237, 0.08);
    }

    /* ─── Messages ─── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 8px;
      display: none;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .messages.active {
      display: flex;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    .msg-group {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .msg-group.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .msg-avatar.bot {
      background: linear-gradient(135deg, #7C3AED, #A78BFA);
      font-size: 16px;
    }

    .msg-avatar.user {
      background: #2a2a2a;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
    }

    .msg-content {
      max-width: 85%;
    }

    .msg-sender {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      margin-bottom: 4px;
    }

    .msg-text {
      font-size: 14px;
      line-height: 1.7;
      color: #d4d4d4;
    }

    .msg-group.user .msg-text {
      color: #e0e0e0;
    }

    .msg-text p { margin-bottom: 8px; }
    .msg-text p:last-child { margin-bottom: 0; }

    /* typing indicator */
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
      animation: dot-bounce 1.4s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1); }
    }

    /* ─── Input Area ─── */
    .input-area {
      padding: 16px 24px 24px;
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 0;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 4px 4px 4px 16px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: #7C3AED;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1);
    }

    .input-box textarea {
      flex: 1;
      border: none;
      background: none;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 0;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 21px;
    }

    .input-box textarea::placeholder {
      color: #555;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: #7C3AED;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: #6D28D9; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .send-btn svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .input-footer {
      text-align: center;
      margin-top: 8px;
      font-size: 11px;
      color: #444;
    }

    /* ─── Mobile ─── */
    @media (max-width: 640px) {
      .topbar { padding: 10px 16px; }
      .input-area { padding: 12px 16px 16px; }
      .messages { padding: 16px 16px 8px; }
      .welcome h1 { font-size: 1.4rem; }
      .suggestions { gap: 6px; }
      .suggestion { font-size: 12px; padding: 8px 14px; }
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <div class="topbar">
    <a href="/" class="topbar-brand">
      <div class="topbar-logo">S</div>
      <span class="topbar-name">Sofía AI</span>
    </a>
    <div class="topbar-actions">
      <span class="topbar-status">En línea</span>
      <a href="/" class="topbar-btn">← Volver</a>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-container">

    <!-- Welcome (shown before first message) -->
    <div class="welcome" id="welcome">
      <div class="welcome-avatar">👩🏽</div>
      <h1>¿En qué puedo ayudarte?</h1>
      <p>Soy Sofía, asistente de SynkDR. Pregúntame sobre productos, envíos, devoluciones o lo que necesites.</p>
      <div class="suggestions">
        <button class="suggestion" data-msg="¿Qué productos tienen disponibles?">📦 Productos disponibles</button>
        <button class="suggestion" data-msg="¿Cuáles son los métodos de pago?">💳 Métodos de pago</button>
        <button class="suggestion" data-msg="¿Cuánto tarda el envío?">🚚 Tiempo de envío</button>
        <button class="suggestion" data-msg="¿Cuál es la política de devoluciones?">🔄 Devoluciones</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages"></div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-box">
        <textarea id="chatInput" rows="1" placeholder="Escríbele a Sofía..." autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Enviar">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-footer">Sofía puede cometer errores. Verifica información importante.</div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    const API_URL = window.location.origin;

    // ── Customer ID (persistent) ──
    function getCustomerId() {
      let id = localStorage.getItem('sofia_customer_id');
      if (!id) {
        id = 'web_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('sofia_customer_id', id);
      }
      return id;
    }

    const welcomeEl = document.getElementById('welcome');
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    let isWaiting = false;
    let chatStarted = false;

    // ── Auto-resize textarea ──
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    // ── Start chat (hide welcome, show messages) ──
    function startChat() {
      if (chatStarted) return;
      chatStarted = true;
      welcomeEl.classList.add('hidden');
      messagesEl.classList.add('active');
    }

    // ── Add message to chat ──
    function addMessage(text, sender) {
      startChat();
      const group = document.createElement('div');
      group.className = `msg-group ${sender}`;

      const avatar = document.createElement('div');
      avatar.className = `msg-avatar ${sender}`;
      avatar.textContent = sender === 'bot' ? '👩🏽' : '👤';

      const content = document.createElement('div');
      content.className = 'msg-content';

      const senderLabel = document.createElement('div');
      senderLabel.className = 'msg-sender';
      senderLabel.textContent = sender === 'bot' ? 'Sofía' : 'Tú';

      const msgText = document.createElement('div');
      msgText.className = 'msg-text';
      msgText.innerHTML = text.replace(/\n/g, '<br>');

      content.appendChild(senderLabel);
      content.appendChild(msgText);
      group.appendChild(avatar);
      group.appendChild(content);
      messagesEl.appendChild(group);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Typing indicator ──
    function showTyping() {
      startChat();
      const group = document.createElement('div');
      group.className = 'msg-group bot';
      group.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar bot';
      avatar.textContent = '👩🏽';

      const content = document.createElement('div');
      content.className = 'msg-content';

      const senderLabel = document.createElement('div');
      senderLabel.className = 'msg-sender';
      senderLabel.textContent = 'Sofía';

      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';

      content.appendChild(senderLabel);
      content.appendChild(dots);
      group.appendChild(avatar);
      group.appendChild(content);
      messagesEl.appendChild(group);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    // ── Send message ──
    async function sendMessage(text) {
      if (!text || isWaiting) return;

      addMessage(text, 'user');
      input.value = '';
      input.style.height = 'auto';

      isWaiting = true;
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customer_id: getCustomerId(),
            message: text,
            channel: 'webchat',
          }),
        });

        hideTyping();
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        addMessage(data.response, 'bot');

      } catch (err) {
        hideTyping();
        console.error('Chat error:', err);
        addMessage('Ups, tuve un problemita de conexión. ¿Puedes intentar otra vez? 🙏', 'bot');
      }

      isWaiting = false;
      sendBtn.disabled = false;
      input.focus();
    }

    // ── Events ──
    sendBtn.addEventListener('click', () => sendMessage(input.value.trim()));

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value.trim());
      }
    });

    // Suggestion chips
    document.querySelectorAll('.suggestion').forEach(btn => {
      btn.addEventListener('click', () => {
        sendMessage(btn.dataset.msg);
      });
    });

    // Auto-focus
    input.focus();
  })();
  </script>

</body>

</html>
